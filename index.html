<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BEN 10 — It's Hero Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050605;
  --deep:#0a0d0a;
  --metal-0:#0f1110;
  --metal-1:#1a1d1a;
  --metal-2:#262a26;
  --metal-3:#3a3f3a;
  --metal-edge:#5a605a;
  --green:#4fdb1f;
  --green-hot:#a6ff5a;
  --green-deep:#1f6b0a;
  --green-mist:rgba(79,219,31,0.18);
  --bone:#e8ffd8;
  --ink:#000;
  --hud:'Chakra Petch', system-ui, sans-serif;
  --display:'Bungee', system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--bone);font-family:var(--hud);overflow:hidden}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  position:relative;
  letter-spacing:.04em;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ───────── Cosmic backdrop: tech grid + starfield ───────── */
.backdrop{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 40%, #0d1a0d 0%, #050605 55%, #000 100%);
}
.grid{
  position:fixed;inset:-50%;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(rgba(79,219,31,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,219,31,0.06) 1px, transparent 1px);
  background-size:64px 64px;
  transform:perspective(800px) rotateX(62deg) translateY(20%) scale(1.4);
  mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 70%);
  animation:gridSlide 14s linear infinite;
}
@keyframes gridSlide{
  from{background-position:0 0,0 0}
  to{background-position:0 64px, 64px 0}
}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.stars i{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--bone);opacity:.5;box-shadow:0 0 6px var(--bone);
  animation:twinkle 3.6s infinite ease-in-out;
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.8)}
  50%{opacity:.9;transform:scale(1.2)}
}

/* Floating "Kirby dot" particles — bloom out on flash */
.kirby{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}
body.flashing .kirby{opacity:1}
.kirby b{
  position:absolute;
  width:var(--s);height:var(--s);
  left:50%;top:50%;
  background:#000;border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  box-shadow:0 0 0 2px rgba(0,0,0,.6);
  animation:kirbyBurst 1.6s var(--d) cubic-bezier(.2,.7,.2,1) paused forwards;
}
body.flashing .kirby b{animation-play-state:running}
@keyframes kirbyBurst{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  20%{opacity:1}
  100%{transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(1);opacity:.85}
}

/* ───────── Stage ───────── */
.stage{
  position:relative;z-index:5;
  width:min(560px, 92vw);
  aspect-ratio:1/1;
  display:grid;place-items:center;
}

/* The activation hint */
.hint{
  position:absolute;
  bottom:-72px;left:50%;transform:translateX(-50%);
  font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:.42em;
  color:var(--bone);opacity:.6;
  display:flex;align-items:center;gap:14px;
  white-space:nowrap;
  animation:hintBreathe 2.4s ease-in-out infinite;
}
.hint::before,.hint::after{
  content:"";display:block;width:28px;height:1px;background:var(--green);
  box-shadow:0 0 8px var(--green);
}
body.activated .hint{opacity:0;transition:opacity .3s}
@keyframes hintBreathe{
  0%,100%{opacity:.4}
  50%{opacity:.85}
}

/* Skip / Replay control */
.audio-toggle{
  position:fixed;top:24px;right:24px;z-index:50;
  background:rgba(10,13,10,.7);
  border:1px solid var(--metal-3);
  color:var(--bone);
  font-family:var(--hud);font-weight:600;font-size:11px;letter-spacing:.3em;
  padding:10px 14px;cursor:pointer;
  backdrop-filter:blur(8px);
  transition:all .2s;
}
.audio-toggle:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 12px var(--green-mist)}
.audio-toggle .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4040;margin-right:8px;vertical-align:middle;box-shadow:0 0 6px #ff4040}
.audio-toggle.on .dot{background:var(--green);box-shadow:0 0 8px var(--green)}

/* ───────── Omnitrix watch ───────── */
.watch{
  position:relative;
  width:78%;aspect-ratio:1/1;
  display:grid;place-items:center;
  cursor:pointer;
  transition:transform .4s cubic-bezier(.4,1.6,.6,1);
}
.watch:hover{transform:scale(1.02)}
body.activated .watch{cursor:default;pointer-events:none;animation:watchLift 1.4s ease-out forwards}
@keyframes watchLift{
  0%{transform:scale(1)}
  40%{transform:scale(1.06) translateY(-4px)}
  100%{transform:scale(1.1) translateY(0)}
}

/* Wrist band (top + bottom strap fragments) */
.band{position:absolute;left:50%;width:62%;height:18%;background:
  linear-gradient(180deg,#0e100e 0%, #1a1d1a 35%, #060706 100%);
  border:1px solid #000;border-radius:14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    inset 0 -2px 8px rgba(0,0,0,.8),
    0 0 0 1px rgba(90,96,90,.12);
}
.band.top{top:-2%;transform:translateX(-50%) perspective(400px) rotateX(28deg)}
.band.bot{bottom:-2%;transform:translateX(-50%) perspective(400px) rotateX(-28deg)}
.band::before,.band::after{
  content:"";position:absolute;left:8%;right:8%;height:3px;
  background:linear-gradient(90deg,transparent,#3a3f3a 12%,#3a3f3a 88%,transparent);
  opacity:.4;
}
.band::before{top:30%}
.band::after{bottom:30%}
/* glow tubing */
.tubing{position:absolute;left:0;right:0;height:2px;background:var(--green);box-shadow:0 0 10px var(--green),0 0 20px var(--green-mist);opacity:.6}
.band.top .tubing{bottom:18%}
.band.bot .tubing{top:18%}

/* Watch body (the chunky bezel) */
.body-ring{
  position:relative;
  width:72%;aspect-ratio:1/1;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%, #2a2e2a 0%, #1a1d1a 30%, #0c0e0c 70%, #050605 100%);
  box-shadow:
    inset 0 4px 12px rgba(255,255,255,.04),
    inset 0 -8px 22px rgba(0,0,0,.9),
    0 18px 40px rgba(0,0,0,.7),
    0 0 0 2px #000;
}
/* Beveled inner ring */
.bezel{
  position:absolute;inset:8%;border-radius:50%;
  background:
    conic-gradient(from 0deg, #1a1d1a, #2e332e, #1a1d1a, #2e332e, #1a1d1a);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.06),
    inset 0 -4px 12px rgba(0,0,0,.8);
}
/* Notches around the bezel — mechanical detail (CSS-only) */
.notches{
  position:absolute;inset:6%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,
    rgba(0,0,0,.7) 0deg 1.2deg,
    transparent 1.2deg 10deg);
  -webkit-mask:radial-gradient(circle, transparent 0%, transparent 84%, #000 86%, #000 96%, transparent 98%);
  mask:radial-gradient(circle, transparent 0%, transparent 84%, #000 86%, #000 96%, transparent 98%);
  opacity:.8;
}

/* The four iconic rim lights — N/E/S/W */
.rim-light{
  position:absolute;
  width:9%;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle, var(--green-hot) 0%, var(--green) 40%, var(--green-deep) 80%, #000 100%);
  box-shadow:
    0 0 12px var(--green),
    0 0 24px var(--green-mist),
    inset 0 0 4px rgba(0,0,0,.6);
  opacity:.55;
  transition:opacity .3s;
}
.rim-light::after{
  content:"";position:absolute;inset:22%;border-radius:50%;
  background:radial-gradient(circle, var(--bone) 0%, transparent 70%);
  opacity:.7;
}
.rim-light.n{top:11%;left:50%;transform:translateX(-50%)}
.rim-light.e{right:11%;top:50%;transform:translateY(-50%)}
.rim-light.s{bottom:11%;left:50%;transform:translateX(-50%)}
.rim-light.w{left:11%;top:50%;transform:translateY(-50%)}

body.activated .rim-light{animation:rimPulse .4s ease-out forwards;animation-delay:.1s}
body.activated .rim-light.e{animation-delay:.2s}
body.activated .rim-light.s{animation-delay:.3s}
body.activated .rim-light.w{animation-delay:.4s}
@keyframes rimPulse{
  0%{opacity:.55;filter:brightness(1)}
  50%{opacity:1;filter:brightness(1.8) saturate(1.4)}
  100%{opacity:1;filter:brightness(1.4)}
}

/* The face / dial (the part that pops UP) */
.face-mount{
  position:absolute;inset:24%;
  display:grid;place-items:center;
  perspective:600px;
}
.face{
  position:relative;
  width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #141714 0%, #0a0c0a 60%, #050605 100%);
  box-shadow:
    inset 0 0 0 3px #000,
    inset 0 0 0 5px #1a1d1a,
    inset 0 0 24px rgba(0,0,0,.9),
    0 6px 18px rgba(0,0,0,.6);
  display:grid;place-items:center;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,1.6,.6,1), box-shadow .6s;
}
/* Inner green outline ring on the face */
.face::before{
  content:"";position:absolute;inset:6%;border-radius:50%;
  border:2px solid var(--green-deep);
  box-shadow:inset 0 0 14px rgba(79,219,31,.12);
  transition:all .5s;
}
body.activated .face{
  transform:translateZ(40px) translateY(-10px);
  box-shadow:
    inset 0 0 0 3px #000,
    inset 0 0 0 5px var(--green-deep),
    inset 0 0 36px rgba(79,219,31,.4),
    0 30px 60px rgba(0,0,0,.8),
    0 0 80px var(--green-mist);
}
body.activated .face::before{
  border-color:var(--green);
  box-shadow:inset 0 0 30px rgba(79,219,31,.5), 0 0 20px var(--green-mist);
}

/* The shape inside the dial — hourglass made of two triangles */
.shape{
  position:relative;width:56%;height:56%;
  display:grid;place-items:center;
}
.tri{
  position:absolute;left:50%;top:50%;
  width:0;height:0;
  transform-origin:50% 50%;
  transition:transform 1.1s cubic-bezier(.65,.05,.35,1), filter .8s;
  filter:drop-shadow(0 0 6px var(--green)) drop-shadow(0 0 14px var(--green-mist));
}
/* Triangle pointing DOWN (top half of hourglass) — base at top, apex meeting at y=0 */
.tri.up{
  border-left:60px solid transparent;
  border-right:60px solid transparent;
  border-top:80px solid var(--green);
  transform:translate(-50%, -80px);
}
/* Triangle pointing UP (bottom half of hourglass) — base at bottom, apex meeting at y=0 */
.tri.dn{
  border-left:60px solid transparent;
  border-right:60px solid transparent;
  border-bottom:80px solid var(--green);
  transform:translate(-50%, 0px);
}
/* Inversion to diamond — the iconic moment.
   Both triangles rotate 180° (flip). Same translate position →
   bases meet at y=0, apexes point outward. */
body.activated .tri.up{
  transform:translate(-50%, -80px) rotate(180deg);
  filter:drop-shadow(0 0 12px var(--green-hot)) drop-shadow(0 0 24px var(--green));
  transition-delay:1.3s;
}
body.activated .tri.dn{
  transform:translate(-50%, 0px) rotate(180deg);
  filter:drop-shadow(0 0 12px var(--green-hot)) drop-shadow(0 0 24px var(--green));
  transition-delay:1.3s;
}

/* Idle pulse on the hourglass */
@keyframes hourglassPulse{
  0%,100%{filter:drop-shadow(0 0 6px var(--green)) drop-shadow(0 0 14px var(--green-mist))}
  50%{filter:drop-shadow(0 0 14px var(--green-hot)) drop-shadow(0 0 30px var(--green))}
}
body:not(.activated) .tri{animation:hourglassPulse 2.6s ease-in-out infinite}

/* Alien silhouette stage — appears inside diamond during cycle phase */
.silhouettes{
  position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;transform:scale(.6);
  transition:opacity .35s, transform .5s;
  z-index:3;pointer-events:none;
}
body.activated .silhouettes{
  opacity:1;transform:scale(1);
  transition-delay:2.5s;
}
.silhouettes img{
  position:absolute;width:46%;height:46%;
  opacity:0;
  filter:drop-shadow(0 0 8px var(--green-hot)) drop-shadow(0 0 16px var(--green));
}
body.activated .silhouettes img{animation:alienCycle .22s ease-out forwards}
body.activated .silhouettes img:nth-child(1){animation-delay:2.60s}
body.activated .silhouettes img:nth-child(2){animation-delay:2.78s}
body.activated .silhouettes img:nth-child(3){animation-delay:2.96s}
body.activated .silhouettes img:nth-child(4){animation-delay:3.14s}
body.activated .silhouettes img:nth-child(5){animation-delay:3.32s}
body.activated .silhouettes img:nth-child(6){animation-delay:3.50s}
body.activated .silhouettes img:nth-child(7){animation-delay:3.68s}
body.activated .silhouettes img:nth-child(8){animation-delay:3.86s}
body.activated .silhouettes img:nth-child(9){animation-delay:4.04s}
body.activated .silhouettes img:nth-child(10){animation-delay:4.22s}
@keyframes alienCycle{
  0%{opacity:0;transform:scale(.7) rotate(-8deg)}
  30%{opacity:1;transform:scale(1.05) rotate(0)}
  70%{opacity:1;transform:scale(1) rotate(0)}
  100%{opacity:0;transform:scale(1.15) rotate(8deg)}
}

/* The white-green flash burst */
.flash{
  position:fixed;inset:0;z-index:10;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, var(--bone) 0%, var(--green-hot) 18%, var(--green) 35%, transparent 70%);
  opacity:0;transform:scale(.2);
  mix-blend-mode:screen;
}
body.activated .flash{animation:flashBurst 1.2s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:4.4s}
@keyframes flashBurst{
  0%{opacity:0;transform:scale(.2)}
  30%{opacity:1;transform:scale(1.4)}
  60%{opacity:.95;transform:scale(2.2)}
  100%{opacity:0;transform:scale(3)}
}

/* Ring shockwave */
.shockwave{
  position:fixed;left:50%;top:50%;
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--green-hot);
  transform:translate(-50%,-50%) scale(0);
  z-index:9;pointer-events:none;opacity:0;
  box-shadow:0 0 30px var(--green);
}
body.activated .shockwave{animation:shock 1.4s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:4.4s}
body.activated .shockwave.two{animation-delay:4.55s;border-color:var(--green)}
@keyframes shock{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(40);opacity:0}
}

/* ───────── Hero landing (revealed after flash) ───────── */
.hero{
  position:fixed;inset:0;z-index:8;
  display:grid;place-items:center;
  pointer-events:none;opacity:0;
  transition:opacity .8s ease-out;
}
body.revealed .hero{opacity:1;pointer-events:auto;transition-delay:.1s}
body.revealed .stage{opacity:0;transition:opacity .5s;pointer-events:none}

.hero-inner{
  display:grid;place-items:center;gap:48px;
  text-align:center;
  padding:40px 24px;
}
.brand{
  position:relative;
  font-family:var(--display);
  font-size:clamp(80px, 18vw, 240px);
  line-height:.85;
  letter-spacing:.02em;
  color:var(--green);
  text-shadow:
    0 0 18px var(--green),
    0 0 48px var(--green-deep),
    6px 6px 0 #000,
    -2px -2px 0 #000;
  -webkit-text-stroke:2px #000;
  transform:translateY(20px);opacity:0;
}
body.revealed .brand{
  animation:slamIn .9s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:.3s;
}
@keyframes slamIn{
  0%{opacity:0;transform:translateY(40px) scale(.85)}
  60%{opacity:1;transform:translateY(-6px) scale(1.04)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.brand .num{
  display:inline-block;color:var(--bone);
  text-shadow:0 0 18px var(--bone), 0 0 36px var(--green), 6px 6px 0 #000;
}
.brand::after{
  content:"";position:absolute;left:-12px;right:-12px;top:-14px;bottom:-14px;
  border:2px solid var(--green);
  border-image:linear-gradient(135deg, var(--green), transparent 30%, transparent 70%, var(--green)) 1;
  opacity:.4;pointer-events:none;
}

.tagline{
  font-family:var(--hud);
  font-weight:700;font-size:clamp(13px, 1.6vw, 18px);
  letter-spacing:.6em;
  color:var(--bone);
  opacity:0;transform:translateY(10px);
  display:flex;align-items:center;gap:18px;
  white-space:nowrap;
}
.tagline::before,.tagline::after{
  content:"";display:block;height:1px;width:40px;background:var(--green);
  box-shadow:0 0 8px var(--green);
}
body.revealed .tagline{animation:fadeUp .7s ease-out forwards;animation-delay:.8s}
@keyframes fadeUp{to{opacity:.9;transform:translateY(0)}}

.nav{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin-top:8px;
}
.nav a,
.nav .nav-item{
  position:relative;
  font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:.42em;
  color:var(--bone);text-decoration:none;
  padding:14px 28px;
  border:1px solid var(--metal-3);
  background:rgba(10,13,10,.6);
  backdrop-filter:blur(6px);
  transition:all .25s;
  opacity:0;transform:translateY(8px);
  text-transform:uppercase;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
}
.nav a:hover{
  border-color:var(--green);color:var(--green);
  box-shadow:0 0 14px var(--green-mist), inset 0 0 14px var(--green-mist);
}
.nav .nav-item[aria-disabled="true"]{
  cursor:default;
  color:rgba(232,255,216,.42);
  border-color:rgba(90,96,90,.45);
}
body.revealed .nav a,
body.revealed .nav .nav-item{animation:fadeUp .6s ease-out forwards}
body.revealed .nav a:nth-child(1),
body.revealed .nav .nav-item:nth-child(1){animation-delay:1.0s}
body.revealed .nav a:nth-child(2),
body.revealed .nav .nav-item:nth-child(2){animation-delay:1.12s}

.watch:focus-visible,
.audio-toggle:focus-visible,
.nav a:focus-visible,
.replay button:focus-visible,
.back-btn:focus-visible,
.slot:focus-visible,
.engage-btn:focus-visible,
.dial-controls button:focus-visible,
.transform-dismiss:focus-visible{
  outline:2px solid var(--green-hot);
  outline-offset:4px;
  box-shadow:0 0 0 4px rgba(79,219,31,.18), 0 0 18px var(--green-mist);
}

/* corner HUD chrome */
.hud-corner{
  position:fixed;z-index:9;
  font-family:var(--hud);font-size:10px;font-weight:600;letter-spacing:.4em;
  color:var(--green);opacity:0;
  transition:opacity .6s;
}
body.revealed .hud-corner{opacity:.7;transition-delay:1.3s}
.hud-corner.tl{top:24px;left:24px}
.hud-corner.bl{bottom:24px;left:24px}
.hud-corner.br{bottom:24px;right:24px}
.hud-corner span{display:block;color:var(--bone);opacity:.5;font-weight:400}

/* Replay watch — tiny omnitrix in the corner that re-triggers */
.replay{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:9;opacity:0;pointer-events:none;
  transition:opacity .5s;
}
body.revealed .replay{opacity:1;pointer-events:auto;transition-delay:1.4s}
.replay button{
  background:rgba(10,13,10,.7);
  border:1px solid var(--metal-3);
  color:var(--bone);
  font-family:var(--hud);font-weight:600;font-size:11px;letter-spacing:.36em;
  padding:10px 16px 10px 36px;cursor:pointer;
  backdrop-filter:blur(8px);
  position:relative;
  transition:all .2s;
}
.replay button::before{
  content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle, var(--green-hot) 0%, var(--green) 50%, var(--green-deep) 100%);
  box-shadow:0 0 8px var(--green);
  animation:replayPulse 2s ease-in-out infinite;
}
@keyframes replayPulse{50%{box-shadow:0 0 16px var(--green-hot)}}
.replay button:hover{border-color:var(--green);color:var(--green)}

/* HUD scanline overlay */
.scanlines{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode:multiply;opacity:.6;
}
.vignette{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.7) 100%);
}

/* ═════════ Aliens Gallery — Omnitrix Dial ═════════ */
.aliens-page{
  position:fixed;inset:0;z-index:7;
  display:grid;place-items:center;
  pointer-events:none;opacity:0;
  transition:opacity .5s ease-out;
  padding:80px 24px 40px;
  overflow:hidden;
}
body.viewing-aliens .aliens-page{opacity:1;pointer-events:auto;transition-delay:.3s}

.dial{

  display:grid;place-items:center;
}
/* Outer rings of the dial */
.dial::before{
  content:"";position:absolute;inset:0;border-radius:50%;

@keyframes dialRingSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Selector arm — wraps the pointer and rotates around dial center */
.dial-pointer-arm{
  position:absolute;inset:0;

.dial-pointer{

/* Alien slots — arranged in a ring */
.slot{

  gap:4px;
  cursor:pointer;

  font-family:var(--hud);
  --angle:0deg;
  transform:
    rotate(var(--angle))
    translateY(calc(-1 * var(--radius)))
    rotate(calc(-1 * var(--angle)));
  transition:filter .3s, opacity .3s;
  opacity:0;
  z-index:3;
}
body.viewing-aliens .slot{opacity:1;animation:slotIn .6s ease-out forwards}
body.viewing-aliens .slot:nth-child(1){animation-delay:.5s}
body.viewing-aliens .slot:nth-child(2){animation-delay:.56s}
body.viewing-aliens .slot:nth-child(3){animation-delay:.62s}
body.viewing-aliens .slot:nth-child(4){animation-delay:.68s}
body.viewing-aliens .slot:nth-child(5){animation-delay:.74s}
body.viewing-aliens .slot:nth-child(6){animation-delay:.80s}
body.viewing-aliens .slot:nth-child(7){animation-delay:.86s}
body.viewing-aliens .slot:nth-child(8){animation-delay:.92s}

@keyframes slotIn{

}
.slot:hover .slot-disc{

}

}
/* Silhouette renderer — pre-rendered PNG dial-style silhouettes shown as-is */
.alien-art{

}
.slot:hover .alien-art{filter:brightness(1.15) drop-shadow(0 0 8px var(--green-hot))}

.center-panel{

}
.center-panel::before{

}
.center-panel::after{

.center-content{

.transform-stage{
  position:fixed;inset:0;z-index:60;
  display:grid;place-items:center;
  pointer-events:none;opacity:0;

<script>
// ───────── Starfield ─────────
(function(){
  const s = document.getElementById('stars');
  const N = 80;
  let html = '';
  for(let i=0;i<N;i++){
    const x = Math.random()*100, y = Math.random()*100;
    const d = (Math.random()*3).toFixed(2);
    const sz = (Math.random()*1.6 + 0.4).toFixed(2);
    html += `<i style="left:${x}%;top:${y}%;animation-delay:${d}s;width:${sz}px;height:${sz}px"></i>`;
  }
  s.innerHTML = html;
})();

// Bezel notches are pure CSS now (repeating-conic-gradient on .notches)

// ───────── Kirby dots burst ─────────
function buildKirby(){
  const k = document.getElementById('kirby');
  const N = 60;
  let html = '';
  for(let i=0;i<N;i++){
    const ang = Math.random()*Math.PI*2;
    const dist = 180 + Math.random()*420;
    const tx = Math.cos(ang)*dist;
    const ty = Math.sin(ang)*dist;
    const sz = 6 + Math.random()*22;
    const d = (Math.random()*0.4).toFixed(2);
    html += `<b style="--tx:${tx.toFixed(0)}px;--ty:${ty.toFixed(0)}px;--s:${sz.toFixed(0)}px;--d:${d}s"></b>`;
  }
  k.innerHTML = html;
}
buildKirby();

// ───────── Audio: real mp3 playback ─────────
let audioEnabled = false;
let flashTimer = null;
let cutActivationTimer = null;
let cutAllTimer = null;

const sndActivation = new Audio('audio/omnitrix-activation.mp3');
const sndFlash = new Audio('audio/omnitrix-flash.mp3');
const sndDial = new Audio('audio/dial_turning.mp3');
[sndActivation, sndFlash, sndDial].forEach(a => {
  a.preload = 'auto';
  a.loop = false;
});
sndActivation.volume = 0.9;
sndFlash.volume = 0.85;
sndDial.volume = 0.7;

// Smooth fade-out helper so cuts don't sound like guillotine drops
function fadeOut(audio, ms = 350){
  if(audio.paused) return;
  const steps = 14;
  const startVol = audio.volume;
  let i = 0;
  const id = setInterval(() => {
    i++;
    audio.volume = Math.max(0, startVol * (1 - i/steps));
    if(i >= steps){
      clearInterval(id);
      try{ audio.pause(); audio.currentTime = 0; audio.volume = startVol; }catch(e){}
    }
  }, ms/steps);
}

function playOmnitrixSequence(){
  if(!audioEnabled) return;
  clearAudioTimers();

  // Fire activation immediately on click; rewind in case of replay
  try{ sndActivation.currentTime = 0; sndActivation.play().catch(()=>{}); }catch(e){}

  // Cut activation when the flash visual hits (so long mp3s don't bleed past the burst)
  cutActivationTimer = setTimeout(() => fadeOut(sndActivation, 250), 4400);

  // Fire the flash/BOOM at the flash moment
  flashTimer = setTimeout(() => {
    if(!audioEnabled) return;
    try{ sndFlash.currentTime = 0; sndFlash.play().catch(()=>{}); }catch(e){}
  }, 4400);

  // Hard-stop everything once the hero is fully revealed (~6.5s in)
  cutAllTimer = setTimeout(() => {
    fadeOut(sndActivation, 250);
    fadeOut(sndFlash, 500);
  }, 6500);
}

function clearAudioTimers(){
  clearTimeout(flashTimer);
  clearTimeout(cutActivationTimer);
  clearTimeout(cutAllTimer);
}

function stopAllAudio(){
  clearAudioTimers();
  const defaults = new Map([[sndActivation, 0.9], [sndFlash, 0.85], [sndDial, 0.7]]);
  defaults.forEach((vol, a) => {
    try{ a.pause(); a.currentTime = 0; a.volume = vol; }catch(e){}
  });
}

// ───────── Activation flow ─────────
const body = document.body;
const watch = document.getElementById('watch');
const stage = document.getElementById('stage');
const hero = document.getElementById('hero');
const replay = document.getElementById('replay');
const replayBtn = document.getElementById('replayBtn');
const audioToggle = document.getElementById('audioToggle');
const backBtn = document.getElementById('backBtn');
const aliensHeader = document.getElementById('aliensHeader');
const aliensPage = document.getElementById('aliensPage');
const dialControls = document.getElementById('dialControls');
const transformStage = document.getElementById('transformStage');
const transformDismiss = document.getElementById('transformDismiss');
const focusableSelector = 'a[href], button, input, select, textarea, [role="button"], [tabindex]';

function setElementActive(el, isActive){
  if(!el) return;
  el.setAttribute('aria-hidden', String(!isActive));
  el.toggleAttribute('inert', !isActive);

  const targets = [
    ...(el.matches(focusableSelector) ? [el] : []),
    ...el.querySelectorAll(focusableSelector)
  ];

  targets.forEach(target => {
    if(isActive){
      if(target.dataset.prevTabindex !== undefined){
        if(target.dataset.prevTabindex === ''){
          target.removeAttribute('tabindex');
        }else{
          target.setAttribute('tabindex', target.dataset.prevTabindex);
        }
        delete target.dataset.prevTabindex;
      }
      return;
    }

    if(target.dataset.prevTabindex === undefined){
      target.dataset.prevTabindex = target.hasAttribute('tabindex') ? target.getAttribute('tabindex') : '';
    }
    target.setAttribute('tabindex', '-1');
  });
}

function setWatchEnabled(isEnabled){
  watch.setAttribute('aria-disabled', String(!isEnabled));
  watch.tabIndex = isEnabled ? 0 : -1;
}

function focusVisibleElement(el){
  if(!el) return;
  requestAnimationFrame(() => {
    if(!el.closest('[inert]')) el.focus({ preventScroll:true });
  });
}

function syncA11yState(){
  const isRevealed = body.classList.contains('revealed');
  const isViewingAliens = body.classList.contains('viewing-aliens');
  const isTransforming = body.classList.contains('transforming');
  const isIntroVisible = !isRevealed;
  const isHeroVisible = isRevealed && !isViewingAliens && !isTransforming;
  const isAliensVisible = isViewingAliens && !isTransforming;

  setElementActive(stage, isIntroVisible);
  setWatchEnabled(isIntroVisible && !body.classList.contains('activated'));
  setElementActive(audioToggle, !isTransforming);
  setElementActive(hero, isHeroVisible);
  setElementActive(replay, isHeroVisible);
  setElementActive(aliensPage, isAliensVisible);
  setElementActive(dialControls, isAliensVisible);
  setElementActive(backBtn, isAliensVisible);
  setElementActive(aliensHeader, isAliensVisible);
  setElementActive(transformStage, isTransforming);
}

function activate(){
  if(body.classList.contains('activated')) return;

  body.classList.add('activated');
  syncA11yState();
  playOmnitrixSequence();

  // Flash phase — show the kirby dots
  setTimeout(() => body.classList.add('flashing'), 4400);

  // Reveal hero — after flash completes
  setTimeout(() => {
    body.classList.add('revealed');
    syncA11yState();
  }, 5400);
}

function reset(){
  stopAllAudio();
  body.classList.remove('activated','flashing','revealed');
  syncA11yState();
  // Rebuild kirby dots so they re-animate next time
  setTimeout(buildKirby, 50);
}

watch.addEventListener('click', activate);
watch.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
});
replayBtn.addEventListener('click', () => {
  reset();
  setTimeout(activate, 400);
});

// ───────── Audio toggle ─────────
audioToggle.addEventListener('click', () => {
  audioEnabled = !audioEnabled;
  audioToggle.classList.toggle('on', audioEnabled);
  audioToggle.innerHTML = audioEnabled
    ? '<span class="dot"></span>SOUND ON'
    : '<span class="dot"></span>SOUND OFF';
  if(!audioEnabled) stopAllAudio();
});

// ═════════ Aliens Gallery ═════════
// Each entry may include an optional `voiceFile` (e.g. 'audio/voice/heatblast.mp3').
// When present, it plays during the engage cinematic timed with the name slam.
// Absent = silent — no error, no console warning.
const ALIENS = [
  { id:'heatblast',   name:'HEATBLAST',   short:'HEAT',   species:'Pyronite',           planet:'Pyros',         powers:'Fire / Flight',          debut:'S1 · E01', img:'assets/aliens/heatblast.png' },
  { id:'wildmutt',    name:'WILDMUTT',    short:'WILD',   species:'Vulpimancer',        planet:'Vulpin',        powers:'Senses / Strength',      debut:'S1 · E01', img:'assets/aliens/wildmutt.png' },
  { id:'diamondhead', name:'DIAMONDHEAD', short:'DIA',    species:'Petrosapien',        planet:'Petropia',      powers:'Crystal / Durability',   debut:'S1 · E01', img:'assets/aliens/diamondhead.png' },
  { id:'xlr8',        name:'XLR8',        short:'XLR8',   species:'Kineceleran',        planet:'Kinet',         powers:'Super Speed',            debut:'S1 · E02', img:'assets/aliens/xlr8.png' },
  { id:'greymatter',  name:'GREY MATTER', short:'GREY',   species:'Galvan',             planet:'Galvan Prime',  powers:'Genius Intellect',       debut:'S1 · E03', img:'assets/aliens/greymatter.png' },
  { id:'fourarms',    name:'FOUR ARMS',   short:'4ARMS',  species:'Tetramand',          planet:'Khoros',        powers:'Strength / Shockwave',   debut:'S1 · E04', img:'assets/aliens/fourarms.png' },
  { id:'stinkfly',    name:'STINKFLY',    short:'STINK',  species:'Lepidopterran',      planet:'Lepidopterra',  powers:'Flight / Slime',         debut:'S1 · E05', img:'assets/aliens/stinkfly.png' },
  { id:'ripjaws',     name:'RIPJAWS',     short:'RIP',    species:'Piscciss Volann',    planet:'Piscciss',      powers:'Aquatic / Bite Force',   debut:'S1 · E07', img:'assets/aliens/ripjaws.png' },
  { id:'upgrade',     name:'UPGRADE',     short:'UPG',    species:'Galvanic Mechamorph',planet:'Galvan B',      powers:'Tech Merging',           debut:'S1 · E08', img:'assets/aliens/upgrade.png' },
  { id:'ghostfreak',  name:'GHOSTFREAK',  short:'GHOST',  species:'Ectonurite',         planet:'Anur Phaetos',  powers:'Intangibility',          debut:'S1 · E10', img:'assets/aliens/ghostfreak.png' }
];

let currentAlien = 0;
let pointerAngle = 0;

function renderDial(){
  const dial = document.getElementById('dial');
  const center = dial.querySelector('.center-panel');

  ALIENS.forEach((a, i) => {
    const angle = i * 36;
    const slot = document.createElement('button');
    slot.className = 'slot';
    slot.style.setProperty('--angle', angle + 'deg');
    slot.dataset.index = i;
    slot.setAttribute('aria-label', a.name);
    slot.innerHTML = `
      <div class="slot-disc">
        <img class="alien-art" src="${a.img}" alt="${a.name} silhouette" draggable="false">
      </div>
      <span class="slot-name">${a.short}</span>
    `;
    slot.addEventListener('click', () => selectAlien(i));
    dial.insertBefore(slot, center);
  });
}

function selectAlien(i){
  const newIndex = ((i % ALIENS.length) + ALIENS.length) % ALIENS.length;
  const changed = newIndex !== currentAlien;

  if(changed){
    // Always rotate the shortest signed direction so wrap (9→0 or 0→9) keeps spinning in the same direction.
    const targetSlotAngle = newIndex * 36;
    const currentSlotAngle = ((pointerAngle % 360) + 360) % 360;
    const diff = ((targetSlotAngle - currentSlotAngle + 540) % 360) - 180;
    pointerAngle += diff;

    if(audioEnabled){
      try{ sndDial.currentTime = 0; sndDial.play().catch(()=>{}); }catch(e){}
    }
  }

  currentAlien = newIndex;
  const a = ALIENS[currentAlien];

  document.querySelectorAll('.slot').forEach((s, idx) => {
    s.classList.toggle('active', idx === currentAlien);
  });

  const centerContent = document.getElementById('centerContent');
  centerContent.innerHTML = `
    <div class="center-num">${String(currentAlien + 1).padStart(2, '0')}</div>
    <h2 class="center-name">${a.name}</h2>
    <div class="center-divider"></div>
    <div class="center-stat">
      <span class="label">SPECIES</span>
      <span class="value">${a.species} · ${a.planet}</span>
    </div>
    <div class="center-stat">
      <span class="label">POWER</span>
      <span class="value">${a.powers}</span>
    </div>
    <div class="center-stat">
      <span class="label">DEBUT · ${a.debut}</span>
    </div>
    <button class="engage-btn" id="engageBtn">ENGAGE TRANSFORM</button>
  `;
  document.getElementById('centerArt').innerHTML = `<img class="alien-art" src="${a.img}" alt="" draggable="false">`;
  document.getElementById('alienIndex').textContent = String(currentAlien + 1).padStart(2, '0') + ' / 10';
  document.getElementById('dialPointer').style.setProperty('--pointer-angle', pointerAngle + 'deg');

  document.getElementById('engageBtn').addEventListener('click', engageTransform);
}

let engageTimer = null;
let currentVoice = null;

function stopVoice(){
  if(currentVoice){
    try{ currentVoice.pause(); currentVoice.currentTime = 0; }catch(e){}
    currentVoice = null;
  }
}

function engageTransform(){
  clearTimeout(engageTimer);
  document.body.classList.remove('engaging', 'transforming');
  syncA11yState();
  void document.body.offsetWidth;
  document.body.classList.add('engaging');
  engageTimer = setTimeout(() => document.body.classList.remove('engaging'), 1300);

  const a = ALIENS[currentAlien];
  const alienImg = document.getElementById('transformAlien');
  alienImg.src = a.img;
  alienImg.alt = a.name;
  document.getElementById('transformName').textContent = a.name;

  requestAnimationFrame(() => {
    document.body.classList.add('transforming');
    syncA11yState();
    focusVisibleElement(transformDismiss);
  });

  if(audioEnabled){
    try{ sndFlash.currentTime = 0; sndFlash.play().catch(()=>{}); }catch(e){}
    setTimeout(() => fadeOut(sndFlash, 400), 1800);

    stopVoice();
    if(a.voiceFile){
      try{
        currentVoice = new Audio(a.voiceFile);
        currentVoice.volume = 0.95;
        // Time the voice to land with the name slam (~340ms post-engage)
        setTimeout(() => {
          if(audioEnabled && currentVoice) currentVoice.play().catch(()=>{});
        }, 340);
      }catch(e){ currentVoice = null; }
    }
  }
}

function dismissTransform(){
  if(!document.body.classList.contains('transforming')) return;
  document.body.classList.remove('transforming');
  syncA11yState();
  stopVoice();
  fadeOut(sndFlash, 250);
  focusVisibleElement(document.getElementById('engageBtn'));
}

document.getElementById('transformDismiss').addEventListener('click', dismissTransform);
document.getElementById('transformStage').addEventListener('click', (e) => {
  // Dismiss when clicking empty stage background (not the alien or name)
  if(e.target.id === 'transformStage') dismissTransform();
});

function showAliens(){
  if(document.body.classList.contains('viewing-aliens')) return;
  document.body.classList.add('viewing-aliens');
  selectAlien(currentAlien);
  syncA11yState();
  focusVisibleElement(document.querySelector('.slot.active'));
}

function hideAliens(){
  document.body.classList.remove('viewing-aliens', 'engaging', 'transforming');
  syncA11yState();
  stopVoice();
  fadeOut(sndDial, 200);
  fadeOut(sndFlash, 250);
  focusVisibleElement(document.querySelector('.nav a[href="#aliens"]'));
}

renderDial();
syncA11yState();

// Hook hero nav links that have live destinations.
document.querySelectorAll('.nav a').forEach(link => {
  const href = link.getAttribute('href');
  if(href === '#aliens'){
    link.addEventListener('click', e => {
      e.preventDefault();
      showAliens();
      history.replaceState(null, '', '#aliens');
    });
  }
});

// Back button
document.getElementById('backBtn').addEventListener('click', () => {
  hideAliens();
  history.replaceState(null, '', window.location.pathname);
});

// Prev / Next
document.getElementById('prevAlien').addEventListener('click', () => selectAlien(currentAlien - 1));
document.getElementById('nextAlien').addEventListener('click', () => selectAlien(currentAlien + 1));

// Keyboard nav while viewing aliens
window.addEventListener('keydown', e => {
  if(!document.body.classList.contains('viewing-aliens')) return;
  // During the transform cinematic, ESC just dismisses the cinematic — arrows blocked.
  if(document.body.classList.contains('transforming')){
    if(e.key === 'Escape'){ e.preventDefault(); dismissTransform(); }
    return;
  }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); selectAlien(currentAlien - 1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); selectAlien(currentAlien + 1); }
  if(e.key === 'Escape'){ hideAliens(); history.replaceState(null, '', window.location.pathname); }
});

// Deep-link support: #aliens lands directly on the gallery, no intro
if(window.location.hash === '#aliens'){
  document.body.classList.add('boot', 'revealed', 'viewing-aliens');
  selectAlien(0);
  syncA11yState();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.remove('boot');
  }));
}
</script>
